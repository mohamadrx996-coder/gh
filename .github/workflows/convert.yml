name: Convert Python to EXE

on:
  repository_dispatch:
    types: [convert_file]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install deps
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pycryptodome pillow

    - name: Download UPX
      run: |
        $release = Invoke-RestMethod -Uri "https://api.github.com/repos/upx/upx/releases/latest" -Headers @{ "User-Agent" = "Mozilla/5.0" }
        $asset = $release.assets | Where-Object { $_.name -like "*win64.zip" } | Select-Object -First 1
        if (-not $asset) { throw "UPX win64 asset not found" }
        Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "upx.zip"
        Expand-Archive -Path "upx.zip" -DestinationPath "upx_dist" -Force
        $upxDir = Get-ChildItem -Path "upx_dist" -Directory | Select-Object -First 1
        if (-not $upxDir) { throw "UPX dir not found after extraction" }
        $upxExe = Join-Path $upxDir.FullName "upx.exe"
        if (-not (Test-Path $upxExe)) { throw "upx.exe not found" }
        echo "UPX_DIR=$($upxDir.FullName)" >> $env:GITHUB_ENV
        echo "UPX_EXE=$upxExe" >> $env:GITHUB_ENV

    - name: Download User File
      run: |
        Invoke-WebRequest -Uri "${{ github.event.client_payload.file_url }}" -OutFile "script.py"

    - name: Download Icon (optional)
      run: |
        $icon = "${{ github.event.client_payload.icon_url }}"
        if ($icon -and $icon.Trim() -ne "") {
          Invoke-WebRequest -Uri $icon -OutFile "app.ico"
          echo "HAS_ICON=1" >> $env:GITHUB_ENV
        } else {
          echo "HAS_ICON=0" >> $env:GITHUB_ENV
        }

    - name: Build EXE
      run: |
        $iconFlag = ""
        if ($env:HAS_ICON -eq "1") {
          $iconFlag = "--icon=app.ico"
        }
        python -m PyInstaller `
          --onefile `
          --noconsole `
          --name script `
          --clean `
          --strip `
          --upx-dir "$env:UPX_DIR" `
          --hidden-import=Crypto `
          --hidden-import=Crypto.Cipher.AES `
          --hidden-import=PIL `
          --hidden-import=PIL.Image `
          --hidden-import=PIL.ImageGrab `
          --exclude-module=tkinter `
          --exclude-module=matplotlib `
          --exclude-module=numpy `
          --exclude-module=scipy `
          --exclude-module=pandas `
          --exclude-module=PyQt5 `
          --exclude-module=PySide2 `
          --exclude-module=PySide6 `
          --exclude-module=unittest `
          --exclude-module=pydoc `
          --exclude-module=xmlrpc `
          $iconFlag `
          script.py

    - name: Compress EXE with UPX
      run: |
        & "$env:UPX_EXE" -9 --lzma dist/script.exe
        $size = (Get-Item "dist/script.exe").Length / 1MB
        Write-Host "Final EXE size: $([math]::Round($size, 2)) MB"

    - uses: actions/upload-artifact@v4
      with:
        name: converted_exe
        path: dist/script.exe
