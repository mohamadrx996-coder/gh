name: Convert Python to EXE
on:
  repository_dispatch:
    types: [convert_file]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install deps
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pycryptodome
    - name: Download User File
      run: |
        Invoke-WebRequest -Uri "${{ github.event.client_payload.file_url }}" -OutFile "script.py"
    - name: Download Icon (optional)
      run: |
        $icon = "${{ github.event.client_payload.icon_url }}"
        if ($icon -and $icon.Trim() -ne "") {
          Invoke-WebRequest -Uri $icon -OutFile "app.ico"
          echo "HAS_ICON=1" >> $env:GITHUB_ENV
        } else {
          echo "HAS_ICON=0" >> $env:GITHUB_ENV
        }
    - name: Build EXE
      run: |
        if ($env:HAS_ICON -eq "1") {
          pyinstaller --onefile --noconsole --name script --clean --icon=app.ico --hidden-import=Crypto --hidden-import=Crypto.Cipher.AES script.py
        } else {
          pyinstaller --onefile --noconsole --name script --clean --hidden-import=Crypto --hidden-import=Crypto.Cipher.AES script.py
        }
    - uses: actions/upload-artifact@v4
      with:
        name: converted_exe
        path: dist/script.exe
