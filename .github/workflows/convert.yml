name: Convert Python to EXE

on:
  repository_dispatch:
    types: [convert_file]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Download User File
      run: |
        # هنا جيت هاب سيقوم بتحميل الملف المرفوع من موقعك
        Invoke-WebRequest -Uri "${{ github.event.client_payload.file_url }}" -OutFile "script.py"

    - name: Build EXE
      run: |
        pyinstaller --onefile --noconsole script.py

    - name: Upload Result
      uses: actions/upload-artifact@v4
      with:
        name: converted_exe
        path: dist/script.exe
